title: Inside the Mind of Steven Rinella | Full Interview with Huckberry Co-Founder
  Richard Greiner
description: "Shop Steven's Waxed Trucker Jacket on Huckberry: https://bit.ly/3HG31UB\n\
  \nJoin Richard Greiner, Co-Founder of Huckberry, as he sits down with Steven Rinella\u2014\
  Outdoorsman, Author, and Founder of MeatEater\u2014at the MeatEater studio in Bozeman,\
  \ Montana. They dig into Steve's incredible journey: from building one of the most\
  \ influential outdoor media brands to raising kids and writing two bestselling children\u2019\
  s books, \u201COutdoor Kids in an Inside World\u201D and \u201CCatch a Crayfish,\
  \ Count the Stars.\u201D\n\nSteven shares what sparked the creation of MeatEater,\
  \ how he balances family life with running a business, and why getting kids outdoors\
  \ is more important than ever. They explore the ethos of turning discomfort into\
  \ resilience, the role of backyard adventures, and the future of ethical hunting\
  \ and conservation.\n\nFeaturing the Flint and Tinder Flannel Lined Waxed Trucker\
  \ Jacket: https://bit.ly/3HG31UB\n\nGrab Steven's Books\nOutdoor Kids in an Inside\
  \ World: https://amzn.to/3TldOGn\nCatch a Crayfish, Count the Stars: https://amzn.to/44gHtH2\n\
  Meat Eater: Adventures from the Life of an American Hunter: https://amzn.to/4kIJSQG\n\
